name: Build release AAB and APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS }}
      KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip project (newest zip in the repo)
        working-directory: .
        run: |
          ZIP=$(git log --diff-filter=AM --name-only --format= -- 'malaz-capacitor-project*.zip' | grep -v '^$' | head -1)
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d project
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Native additions (print plugin, share, notifications)
        run: bash native/setup.sh
      - run: npx capacitor-assets generate --android || true
      - name: Force target/compile SDK 36 and set version code
        run: |
          sed -i -E 's/(targetSdkVersion *= *)[0-9]+/\136/; s/(compileSdkVersion *= *)[0-9]+/\136/' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat android/variables.gradle
      - name: Add signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KS_KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - run: npx cap sync android
      - name: Build
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: malaz-release
          path: |
            project/android/app/build/outputs/bundle/release/*.aab
            project/android/app/build/outputs/apk/release/*.apk
